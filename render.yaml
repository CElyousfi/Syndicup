# Render Blueprint — SyndicUp (Master Spec Partie 15 ; docs/DEPLOYMENT.md).
# Quatre services Node : API + web en staging (branche `staging`) et en production (branche `main`),
# région Frankfurt. Aucune valeur secrète ici : chaque secret est déclaré `sync: false` et saisi
# dans le tableau de bord Render (ou son groupe d'environnement). Les paramètres techniques non
# secrets (plafonds de rate limiting, délais de confort) portent leur défaut applicatif en clair
# (`value:`) — ils restent modifiables depuis le tableau de bord sans toucher au code.
# Ordre de mise en production : migrations d'abord (`prisma migrate deploy` avec DIRECT_URL),
# puis déploiement (docs/DEPLOYMENT.md §« Migrer puis déployer »).
services:
  # ── Staging (branche staging) ──────────────────────────────────────────────
  - type: web
    name: syndicup-api-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: staging
    rootDir: .
    # --include=dev : NODE_ENV=production (ci-dessous) fait sauter les devDependencies à `npm ci`
    # par défaut — or `next build` en a besoin pour le type-check (typescript, @types/react…),
    # qui tourne au build, pas au runtime. Sans ce drapeau, le build échoue sur ces modules absents.
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace=@copropriete-maroc/api
    startCommand: npm run start --workspace=@copropriete-maroc/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_API_SECRET
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CMI_MERCHANT_ID
        sync: false
      - key: CMI_STORE_KEY
        sync: false
      - key: CMI_API_URL
        sync: false
      - key: CMI_WEBHOOK_HMAC_SECRET
        sync: false
      # Hook GoTrue « Send SMS » — code de connexion réel via Infobip (M0, apps/api/lib/auth/send-sms-hook.ts).
      - key: SUPABASE_AUTH_HOOK_SEND_SMS_SECRET
        sync: false
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_BASE_URL
        sync: false
      - key: INFOBIP_SENDER
        sync: false
      - key: RATE_LIMIT_AUTH_HOOK_SMS_MAX
        value: "30"
      # Plafonds techniques de rate limiting (lib/rate-limit) — défauts applicatifs, ajustables
      # depuis le tableau de bord sans redéploiement.
      - key: RATE_LIMIT_OTP_REQUEST_MAX
        value: "5"
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_FINANCE_MAX
        value: "30"
      - key: RATE_LIMIT_COMMENTAIRE_MAX
        value: "10"
      - key: RATE_LIMIT_CMI_WEBHOOK_MAX
        value: "120"
      # Délai de confort du rappel d'AG (pas une valeur légale — lib/ag/rappels.ts).
      - key: AG_RAPPEL_JOURS_AVANT
        value: "3"

  - type: web
    name: syndicup-web-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: staging
    rootDir: .
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace=@copropriete-maroc/web
    startCommand: npm run start --workspace=@copropriete-maroc/web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  # ── Production (branche main) ──────────────────────────────────────────────
