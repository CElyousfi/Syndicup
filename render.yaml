      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_API_SECRET
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CMI_MERCHANT_ID
        sync: false
      - key: CMI_STORE_KEY
        sync: false
      - key: CMI_API_URL
        sync: false
      - key: CMI_WEBHOOK_HMAC_SECRET
        sync: false
      # Hook GoTrue « Send SMS » — code de connexion réel via Infobip (M0, apps/api/lib/auth/send-sms-hook.ts).
      - key: SUPABASE_AUTH_HOOK_SEND_SMS_SECRET
        sync: false
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_BASE_URL
        sync: false
      - key: INFOBIP_SENDER
        sync: false
      - key: RATE_LIMIT_AUTH_HOOK_SMS_MAX
        value: "30"
      # Plafonds techniques de rate limiting (lib/rate-limit) — défauts applicatifs, ajustables
      # depuis le tableau de bord sans redéploiement.
      - key: RATE_LIMIT_OTP_REQUEST_MAX
        value: "5"
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_FINANCE_MAX
        value: "30"
      - key: RATE_LIMIT_COMMENTAIRE_MAX
        value: "10"
      - key: RATE_LIMIT_CMI_WEBHOOK_MAX
        value: "120"
      # Délai de confort du rappel d'AG (pas une valeur légale — lib/ag/rappels.ts).
      - key: AG_RAPPEL_JOURS_AVANT
        value: "3"

  - type: web
    name: syndicup-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace=@copropriete-maroc/web
    startCommand: npm run start --workspace=@copropriete-maroc/web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
