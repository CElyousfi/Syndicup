name: syndicup
description: "SyndicUp — gestion de copropriété (Maroc). Application mobile iOS/Android."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  intl: ^0.19.0
  mobile_scanner: ^6.0.7
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  pdfx: ">=2.9.0 <2.10.0"
  qr_flutter: ^4.1.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  collection: ^1.19.0
  flutter_animate: ^4.5.2
  audioplayers: ^6.6.0
  battery_plus: ^7.1.2
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/illustrations/
    - assets/sounds/
  fonts:
    # Langage « Wise » : Inter pour toute l'interface, Archivo semi-condensé Black pour les
    # titres-affiches (substitut libre de Wise Sans), Noto Kufi Arabic pour les affiches en arabe.
    # Licences OFL : assets/fonts/LICENSES.md.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SuDisplay
      fonts:
        - asset: assets/fonts/ArchivoDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/ArchivoDisplay-Black.ttf
          weight: 900
    - family: SuWordmark
      fonts:
        - asset: assets/fonts/SuWordmark-Black.ttf
          weight: 900
    - family: SuDisplayAr
      fonts:
        - asset: assets/fonts/NotoKufiArabic-ExtraBold.ttf
          weight: 800
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1E7552"
  adaptive_icon_foreground: "assets/images/logo-foreground.png"
  remove_alpha_ios: true
